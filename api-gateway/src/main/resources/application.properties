spring.application.name=api-gateway
server.port=8080
server.address=127.0.0.1

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Ruta 1: Microservicio de Observaciones (8081)
spring.cloud.gateway.server.webmvc.routes[0].id=observaciones-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/observaciones/**

# Ruta 2: Microservicio de Usuarios (8082)
spring.cloud.gateway.server.webmvc.routes[1].id=usuarios-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/usuarios/**

# Ruta 3: Microservicio de Accesos (8083)
spring.cloud.gateway.server.webmvc.routes[2].id=accesos-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/accesos/**